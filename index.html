<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سبيل - برادات الماء</title>
<meta name="theme-color" content="#0B2B33">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B2B33; --ink2:#35565E; --water:#1597A5; --water-dark:#0F7480;
    --mist:#EAF4F5; --card:#FFFFFF; --line:#D3E3E6;
      --good:#2E9E6B; --warn:#E3A72F; --bad:#D9503A;
        --r-lg:22px; --r-md:14px; --r-sm:999px;
        }
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
        html,body{height:100%;margin:0}
        body{font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;color:var(--ink);background:var(--mist);overflow:hidden}
        button{font-family:inherit;cursor:pointer}
        :focus-visible{outline:3px solid var(--water);outline-offset:2px}

        .app{position:fixed;inset:0;display:flex;flex-direction:column}
        header{background:var(--ink);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 18px 14px;display:flex;align-items:center;gap:12px;z-index:500}
        .logo{width:40px;height:40px;flex:none}
        header h1{font-size:22px;font-weight:800;margin:0;line-height:1}
        header p{margin:3px 0 0;font-size:13px;color:#A8CBD1}
        .count{margin-inline-start:auto;background:rgba(255,255,255,.12);border-radius:var(--r-sm);padding:6px 14px;font-weight:700;font-size:14px;white-space:nowrap}

        main{flex:1;position:relative;min-height:0}
        #map{position:absolute;inset:0;direction:ltr;z-index:1}
        .view-list{position:absolute;inset:0;background:var(--mist);overflow-y:auto;padding:14px 14px 120px;z-index:400;display:none}
        .view-list.on{display:block}

        nav{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 14px);left:50%;transform:translateX(-50%);z-index:600;display:flex;align-items:center;gap:8px;background:var(--ink);padding:6px;border-radius:var(--r-sm);box-shadow:0 8px 24px rgba(11,43,51,.35)}
        nav button{border:0;background:transparent;color:#BFD9DD;font-size:15px;font-weight:700;padding:10px 16px;border-radius:var(--r-sm);white-space:nowrap}
        nav button.on{background:#fff;color:var(--ink)}
        nav .add{background:var(--water);color:#fff;display:flex;align-items:center;gap:6px}
        nav .add:active{background:var(--water-dark)}

        .locate{position:absolute;top:14px;left:14px;z-index:500;width:46px;height:46px;border-radius:50%;border:0;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.2);display:grid;place-items:center}
        .legend{position:absolute;top:14px;right:14px;z-index:500;background:#fff;border-radius:var(--r-md);padding:8px 12px;font-size:12px;font-weight:500;box-shadow:0 3px 12px rgba(0,0,0,.15);display:flex;flex-direction:column;gap:4px}
        .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px}

        .banner{position:absolute;top:14px;left:14px;right:14px;z-index:700;background:var(--ink);color:#fff;border-radius:var(--r-md);padding:12px 14px;display:none;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
        .banner.on{display:flex}
        .banner span{flex:1;font-size:14px;line-height:1.5}
        .banner button{border:0;border-radius:var(--r-sm);padding:8px 14px;font-weight:700;font-size:13px}
        .banner .me{background:var(--water);color:#fff}
        .banner .x{background:rgba(255,255,255,.15);color:#fff}

        .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start;cursor:pointer;text-align:start;width:100%}
        .card:active{background:#F4FAFA}
        .dot{width:14px;height:14px;border-radius:50%;margin-top:6px;flex:none}
        .card h3{margin:0 0 6px;font-size:17px;font-weight:700}
        .chips{display:flex;flex-wrap:wrap;gap:6px}
        .chip{font-size:12.5px;font-weight:500;padding:4px 10px;border-radius:var(--r-sm);background:var(--mist);color:var(--ink2)}
        .chip.good{background:#DDF3E8;color:#17653F}
        .chip.warn{background:#FBEFCF;color:#7A5608}
        .chip.bad{background:#F9DDD7;color:#8F2B1A}
        .dist{margin-inline-start:auto;font-size:12.5px;color:var(--ink2);white-space:nowrap;padding-top:3px}
        .empty{text-align:center;padding:60px 20px;color:var(--ink2)}
        .empty h2{color:var(--ink);margin:0 0 8px}

        .scrim{position:fixed;inset:0;background:rgba(11,43,51,.5);z-index:900;display:none}
        .scrim.on{display:block}
        .sheet{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:#fff;border-radius:26px 26px 0 0;padding:10px 20px calc(env(safe-area-inset-bottom) + 20px);max-height:88vh;overflow-y:auto;transform:translateY(105%);transition:transform .28s ease}
        .sheet.on{transform:none}
        .grip{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
        .sheet h2{margin:0 0 4px;font-size:21px;font-weight:800}
        .sheet .sub{color:var(--ink2);font-size:13.5px;margin:0 0 16px}
        label.fld{display:block;font-weight:700;font-size:14.5px;margin:14px 0 8px}
        input[type=text]{width:100%;font-family:inherit;font-size:16px;padding:13px 14px;border:2px solid var(--line);border-radius:var(--r-md);background:#fff;color:var(--ink)}
        input[type=text]:focus{border-color:var(--water);outline:none}
        .seg{display:flex;gap:8px}
        .seg button{flex:1;border:2px solid var(--line);background:#fff;border-radius:var(--r-md);padding:12px 6px;font-size:14.5px;font-weight:700;color:var(--ink2)}
        .seg button.on.good{border-color:var(--good);background:#DDF3E8;color:#17653F}
        .seg button.on.warn{border-color:var(--warn);background:#FBEFCF;color:#7A5608}
        .seg button.on.bad{border-color:var(--bad);background:#F9DDD7;color:#8F2B1A}
        .actions{display:flex;gap:10px;margin-top:22px}
        .btn{flex:1;border:0;border-radius:var(--r-md);padding:15px;font-size:16px;font-weight:800}
        .btn.primary{background:var(--water);color:#fff}
        .btn.primary:active{background:var(--water-dark)}
        .btn.ghost{background:var(--mist);color:var(--ink)}
        .btn.danger{flex:none;background:#F9DDD7;color:#8F2B1A;padding:15px 18px}
        .meta{font-size:12.5px;color:var(--ink2);margin-top:14px}

        .toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 90px);left:50%;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:var(--r-sm);font-weight:700;font-size:14px;z-index:1200;opacity:0;pointer-events:none;transition:.25s}
        .toast.on{opacity:1;transform:translate(-50%,0)}
        .pin{background:none;border:0}
        @media (prefers-reduced-motion:reduce){.sheet,.toast{transition:none}}
        @media (min-width:700px){
          .sheet{left:50%;right:auto;width:520px;transform:translate(-50%,105%)}
            .sheet.on{transform:translate(-50%,0)}
              .view-list{padding-inline:max(14px,calc(50% - 320px))}
              }
              </style>
              </head>
              <body>
              <div class="app">
                <header>
                    <svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="16" fill="#1597A5"/><path d="M32 10C32 10 17 28 17 39a15 15 0 0 0 30 0C47 28 32 10 32 10Z" fill="#fff"/><path d="M25 40a7 7 0 0 0 7 7" stroke="#1597A5" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg>
                        <div><h1>سبيل</h1><p>برادات ماء في خدمة الجميع</p></div>
                            <div class="count" id="count">0 برّاد</div>
                              </header>
                                <main>
                                    <div id="map" role="application" aria-label="خريطة برادات الماء"></div>
                                        <button class="locate" id="locateBtn" aria-label="موقعي"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0B2B33" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
                                            <div class="legend" id="legend"><div><i style="background:var(--good)"></i>ممتاز</div><div><i style="background:var(--warn)"></i>فيه ملاحظة</div><div><i style="background:var(--bad)"></i>خربان</div></div>
                                                <div class="banner" id="banner"><span id="bannerText">اضغط على الخريطة لتحديد مكان البرّاد</span><button class="me" id="useMe">موقعي</button><button class="x" id="cancelAdd">إلغاء</button></div>
                                                    <section class="view-list" id="listView" aria-label="قائمة البرادات"></section>
                                                        <nav id="nav">
                                                              <button class="on" id="tabMap">الخريطة</button>
                                                                    <button id="tabList">القائمة</button>
                                                                          <button class="add" id="addBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>أضف برّاد</button>
                                                                              </nav>
                                                                                </main>
                                                                                </div>

                                                                                <div class="scrim" id="scrim"></div>
                                                                                <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
                                                                                <div class="toast" id="toast" role="status"></div>

                                                                                <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
                                                                                <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
                                                                                <script>
                                                                                /* ============ طبقة التخزين: Supabase ============ */
                                                                                const store = (() => {
                                                                                  // ⬇⬇⬇ تم دمج بياناتك هنا ⬇⬇⬇
                                                                                    const SUPABASE_URL  = 'https://bccwfbkutjnuoemhqhlj.supabase.co';
                                                                                      const SUPABASE_ANON = 'sb_publishable_pGDX6met314uf7SuTSupCw_INmBxTSr';
                                                                                        // ⬆⬆⬆ لا تلمس هذولا السطرين ⬆⬆⬆

                                                                                          const TABLE = 'coolers';
                                                                                            const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

                                                                                              const fromRow = r => ({
                                                                                                  id:        r.id,
                                                                                                      name:      r.name,
                                                                                                          lat:       r.lat,
                                                                                                              lng:       r.lng,
                                                                                                                  clean:     r.clean,
                                                                                                                      flow:      r.flow,
                                                                                                                          cold:      r.cold,
                                                                                                                              createdAt: new Date(r.created_at).getTime(),
                                                                                                                                  updatedAt: new Date(r.updated_at).getTime(),
                                                                                                                                    });

                                                                                                                                      const toRow = c => ({
                                                                                                                                          name:  c.name,
                                                                                                                                              lat:   c.lat,
                                                                                                                                                  lng:   c.lng,
                                                                                                                                                      clean: c.clean,
                                                                                                                                                          flow:  c.flow,
                                                                                                                                                              cold:  c.cold,
                                                                                                                                                                });

                                                                                                                                                                  return {
                                                                                                                                                                      persistent: true,

                                                                                                                                                                          async list() {
                                                                                                                                                                                const { data, error } = await sb
                                                                                                                                                                                        .from(TABLE)
                                                                                                                                                                                                .select('*')
                                                                                                                                                                                                        .order('updated_at', { ascending: false });
                                                                                                                                                                                                              if (error) { console.error('store.list:', error); throw error; }
                                                                                                                                                                                                                    return (data || []).map(fromRow);
                                                                                                                                                                                                                        },

                                                                                                                                                                                                                            async add(c) {
                                                                                                                                                                                                                                  const { data, error } = await sb
                                                                                                                                                                                                                                          .from(TABLE)
                                                                                                                                                                                                                                                  .insert(toRow(c))
                                                                                                                                                                                                                                                          .select()
                                                                                                                                                                                                                                                                  .single();
                                                                                                                                                                                                                                                                        if (error) { console.error('store.add:', error); throw error; }
                                                                                                                                                                                                                                                                              return fromRow(data);
                                                                                                                                                                                                                                                                                  },

                                                                                                                                                                                                                                                                                      async update(id, patch) {
                                                                                                                                                                                                                                                                                            const rowPatch = {};
                                                                                                                                                                                                                                                                                                  if (patch.name  !== undefined) rowPatch.name  = patch.name;
                                                                                                                                                                                                                                                                                                        if (patch.clean !== undefined) rowPatch.clean = patch.clean;
                                                                                                                                                                                                                                                                                                              if (patch.flow  !== undefined) rowPatch.flow  = patch.flow;
                                                                                                                                                                                                                                                                                                                    if (patch.cold  !== undefined) rowPatch.cold  = patch.cold;

                                                                                                                                                                                                                                                                                                                          const { data, error } = await sb
                                                                                                                                                                                                                                                                                                                                  .from(TABLE)
                                                                                                                                                                                                                                                                                                                                          .update(rowPatch)
                                                                                                                                                                                                                                                                                                                                                  .eq('id', id)
                                                                                                                                                                                                                                                                                                                                                          .select()
                                                                                                                                                                                                                                                                                                                                                                  .single();
                                                                                                                                                                                                                                                                                                                                                                        if (error) { console.error('store.update:', error); throw error; }
                                                                                                                                                                                                                                                                                                                                                                              return fromRow(data);
                                                                                                                                                                                                                                                                                                                                                                                  },

                                                                                                                                                                                                                                                                                                                                                                                      async remove(id) {
                                                                                                                                                                                                                                                                                                                                                                                            const { error } = await sb
                                                                                                                                                                                                                                                                                                                                                                                                    .from(TABLE)
                                                                                                                                                                                                                                                                                                                                                                                                            .delete()
                                                                                                                                                                                                                                                                                                                                                                                                                    .eq('id', id);
                                                                                                                                                                                                                                                                                                                                                                                                                          if (error) { console.error('store.remove:', error); throw error; }
                                                                                                                                                                                                                                                                                                                                                                                                                              },
                                                                                                                                                                                                                                                                                                                                                                                                                                };
                                                                                                                                                                                                                                                                                                                                                                                                                                })();

                                                                                                                                                                                                                                                                                                                                                                                                                                /* ============ التعريفات ============ */
                                                                                                                                                                                                                                                                                                                                                                                                                                const FIELDS = {
                                                                                                                                                                                                                                                                                                                                                                                                                                  clean: { label:'النظافة',  opts:[['clean','نظيف','good'],['filter','يحتاج تغيير فلتر','warn']] },
                                                                                                                                                                                                                                                                                                                                                                                                                                    flow:  { label:'قوة التدفق', opts:[['fast','سريع','good'],['slow','بطيء','warn']] },
                                                                                                                                                                                                                                                                                                                                                                                                                                      cold:  { label:'البرودة',  opts:[['cold','بارد','good'],['medium','متوسط','warn'],['broken','خربان','bad']] }
                                                                                                                                                                                                                                                                                                                                                                                                                                      };
                                                                                                                                                                                                                                                                                                                                                                                                                                      const optOf = (f, v) => FIELDS[f].opts.find(o=>o[0]===v) || FIELDS[f].opts[0];
                                                                                                                                                                                                                                                                                                                                                                                                                                      const health = c => {
                                                                                                                                                                                                                                                                                                                                                                                                                                        if (c.cold==='broken') return 'bad';
                                                                                                                                                                                                                                                                                                                                                                                                                                          if (c.clean==='filter' || c.flow==='slow' || c.cold==='medium') return 'warn';
                                                                                                                                                                                                                                                                                                                                                                                                                                            return 'good';
                                                                                                                                                                                                                                                                                                                                                                                                                                            };
                                                                                                                                                                                                                                                                                                                                                                                                                                            const COLORS = { good:'#2E9E6B', warn:'#E3A72F', bad:'#D9503A' };
                                                                                                                                                                                                                                                                                                                                                                                                                                            const $ = id => document.getElementById(id);
                                                                                                                                                                                                                                                                                                                                                                                                                                            const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
                                                                                                                                                                                                                                                                                                                                                                                                                                            const fmtDate = ts => new Date(ts).toLocaleDateString('ar-SA', { day:'numeric', month:'long', year:'numeric' });

                                                                                                                                                                                                                                                                                                                                                                                                                                            /* ============ الخريطة ============ */
                                                                                                                                                                                                                                                                                                                                                                                                                                            const map = L.map('map', { zoomControl:false }).setView([24.7136, 46.6753], 12);
                                                                                                                                                                                                                                                                                                                                                                                                                                            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'© OpenStreetMap' }).addTo(map);

                                                                                                                                                                                                                                                                                                                                                                                                                                            let coolers = [], markers = {}, me = null, meMarker = null, mode = 'browse', tempMarker = null, pickedLatLng = null;

                                                                                                                                                                                                                                                                                                                                                                                                                                            const pinIcon = h => L.divIcon({
                                                                                                                                                                                                                                                                                                                                                                                                                                              className:'pin', iconSize:[38,46], iconAnchor:[19,44],
                                                                                                                                                                                                                                                                                                                                                                                                                                                html:`<svg width="38" height="46" viewBox="0 0 38 46"><path d="M19 1C9.6 1 2 8.4 2 17.6 2 30 19 44 19 44s17-14 17-26.4C36 8.4 28.4 1 19 1Z" fill="${COLORS[h]}" stroke="#fff" stroke-width="2.5"/><path d="M19 9c0 0-6.5 7.5-6.5 12.2a6.5 6.5 0 0 0 13 0C25.5 16.5 19 9 19 9Z" fill="#fff"/></svg>`
                                                                                                                                                                                                                                                                                                                                                                                                                                                });

                                                                                                                                                                                                                                                                                                                                                                                                                                                function distKm(a, b){
                                                                                                                                                                                                                                                                                                                                                                                                                                                  const R=6371, rad=x=>x*Math.PI/180;
                                                                                                                                                                                                                                                                                                                                                                                                                                                    const dLat=rad(b.lat-a.lat), dLng=rad(b.lng-a.lng);
                                                                                                                                                                                                                                                                                                                                                                                                                                                      const s=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLng/2)**2;
                                                                                                                                                                                                                                                                                                                                                                                                                                                        return 2*R*Math.asin(Math.sqrt(s));
                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                        const fmtDist = km => km < 1 ? `${Math.round(km*1000)} م` : `${km.toFixed(1)} كم`;

                                                                                                                                                                                                                                                                                                                                                                                                                                                        function chipsHtml(c){
                                                                                                                                                                                                                                                                                                                                                                                                                                                          return ['clean','flow','cold'].map(f => { const o = optOf(f, c[f]); return `<span class="chip ${o[2]}">${o[1]}</span>`; }).join('');
                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                          function render(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                            $('count').textContent = coolers.length + ' برّاد';
                                                                                                                                                                                                                                                                                                                                                                                                                                                              Object.values(markers).forEach(m => map.removeLayer(m)); markers = {};
                                                                                                                                                                                                                                                                                                                                                                                                                                                                coolers.forEach(c => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const m = L.marker([c.lat, c.lng], { icon: pinIcon(health(c)), title: c.name }).addTo(map);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        m.on('click', () => { if(mode==='browse') openEdit(c.id); });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            markers[c.id] = m;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const sorted = [...coolers];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if (me) sorted.sort((a,b) => distKm(me,a) - distKm(me,b)); else sorted.sort((a,b)=>b.updatedAt-a.updatedAt);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const lv = $('listView');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if (!sorted.length) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          lv.innerHTML = `<div class="empty"><h2>ما فيه برادات للحين</h2><p>أضف أول برّاد ماء قريب منك، وساعد غيرك يلقى ماء بارد ونظيف.</p></div>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                lv.innerHTML = sorted.map(c => `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <button class="card" data-id="${c.id}">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <span class="dot" style="background:${COLORS[health(c)]}"></span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div><h3>${esc(c.name)}</h3><div class="chips">${chipsHtml(c)}</div></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              ${me ? `<span class="dist">${fmtDist(distKm(me,c))}</span>` : ''}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </button>`).join('');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        lv.querySelectorAll('.card').forEach(el => el.onclick = () => { showView('map'); const c = coolers.find(x=>x.id===el.dataset.id); map.setView([c.lat,c.lng],17); openEdit(c.id); });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          async function refresh(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            try {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                coolers = await store.list();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    render();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      } catch (e) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          toast('ما قدرنا نجيب البيانات، تأكد من الاتصال');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            /* ============ التنقل ============ */
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            function showView(v){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              $('listView').classList.toggle('on', v==='list');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                $('tabMap').classList.toggle('on', v==='map');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  $('tabList').classList.toggle('on', v==='list');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    $('locateBtn').style.display = $('legend').style.display = v==='map' ? '' : 'none';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if(v==='map') setTimeout(()=>map.invalidateSize(),50);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      $('tabMap').onclick = () => showView('map');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      $('tabList').onclick = () => showView('list');

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      /* ============ الموقع ============ */
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      function locate(cb, fly=true){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if(!navigator.geolocation){ toast('جهازك ما يدعم تحديد الموقع'); return; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          navigator.geolocation.getCurrentPosition(p => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              me = { lat:p.coords.latitude, lng:p.coords.longitude };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  if(meMarker) map.removeLayer(meMarker);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      meMarker = L.circleMarker([me.lat,me.lng], { radius:9, color:'#fff', weight:3, fillColor:'#1597A5', fillOpacity:1 }).addTo(map);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if(fly) map.setView([me.lat,me.lng], 16);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              render(); cb && cb(me);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }, () => toast('فعّل إذن الموقع من إعدادات المتصفح'), { enableHighAccuracy:true, timeout:10000 });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                $('locateBtn').onclick = () => locate();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                /* ============ إضافة برّاد ============ */
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                function startAdd(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  mode = 'pick'; pickedLatLng = null;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    $('banner').classList.add('on'); $('nav').style.display = 'none';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      showView('map');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      function endAdd(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        mode = 'browse'; $('banner').classList.remove('on'); $('nav').style.display = '';
