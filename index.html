                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if(tempMarker){ map.removeLayer(tempMarker); tempMarker = null; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          $('addBtn').onclick = startAdd;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          $('cancelAdd').onclick = endAdd;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          $('useMe').onclick = () => locate(p => pickPoint(p.lat, p.lng));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          map.on('click', e => { if(mode==='pick') pickPoint(e.latlng.lat, e.latlng.lng); });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          function pickPoint(lat, lng){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            pickedLatLng = { lat, lng };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if(tempMarker) map.removeLayer(tempMarker);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                tempMarker = L.marker([lat,lng], { icon: pinIcon('good') }).addTo(map);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  openSheet({ mode:'add', data:{ name:'', clean:'clean', flow:'fast', cold:'cold' } });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  /* ============ النافذة (إضافة وتعديل) ============ */
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  let sheetState = null;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  function segHtml(f, val){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return `<div class="seg" data-field="${f}">` + FIELDS[f].opts.map(o => `<button type="button" class="${o[2]} ${o[0]===val?'on':''}" data-v="${o[0]}">${o[1]}</button>`).join('') + `</div>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function openSheet(state){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      sheetState = state;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const d = state.data, add = state.mode==='add';
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          $('sheet').innerHTML = `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="grip"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <h2>${add ? 'برّاد جديد' : esc(d.name)}</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <p class="sub">${add ? 'حدد حالة البرّاد عشان يستفيد منه الناس' : 'تغيّرت الحالة؟ حدّثها وساعد غيرك'}</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          ${add ? `<label class="fld" for="nm">اسم المكان</label><input type="text" id="nm" maxlength="60" placeholder="مثال: برّاد مسجد الرحمة" value="${esc(d.name)}">` : ''}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <label class="fld">النظافة</label>${segHtml('clean', d.clean)}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <label class="fld">قوة التدفق</label>${segHtml('flow', d.flow)}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <label class="fld">البرودة</label>${segHtml('cold', d.cold)}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          ${add ? '' : `<div class="meta">آخر تحديث: ${fmtDate(d.updatedAt)}${me ? ' · يبعد ' + fmtDist(distKm(me,d)) : ''}</div>`}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="actions">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ${add ? '' : `<button class="btn danger" id="delBtn">حذف</button>`}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <button class="btn ghost" id="closeBtn">إغلاق</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button class="btn primary" id="saveBtn">${add ? 'أضف البرّاد' : 'حفظ التحديث'}</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      $('sheet').querySelectorAll('.seg').forEach(seg => seg.querySelectorAll('button').forEach(b => b.onclick = () => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          seg.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              sheetState.data[seg.dataset.field] = b.dataset.v;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }));
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  $('closeBtn').onclick = closeSheet;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    $('saveBtn').onclick = save;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      if(!add) $('delBtn').onclick = remove;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        $('scrim').classList.add('on'); $('sheet').classList.add('on');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        function closeSheet(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          $('sheet').classList.remove('on'); $('scrim').classList.remove('on');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if(sheetState && sheetState.mode==='add') endAdd();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              sheetState = null;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              $('scrim').onclick = closeSheet;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              document.addEventListener('keydown', e => { if(e.key==='Escape' && sheetState) closeSheet(); });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              function openEdit(id){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const c = coolers.find(x=>x.id===id); if(!c) return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  openSheet({ mode:'edit', id, data:{...c} });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  async function save(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const s = sheetState, d = s.data;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const btn = $('saveBtn');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        btn.disabled = true;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          try {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if(s.mode==='add'){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const name = $('nm').value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if(!name){ toast('اكتب اسم المكان أول'); $('nm').focus(); btn.disabled=false; return; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                await store.add({ name, lat:pickedLatLng.lat, lng:pickedLatLng.lng, clean:d.clean, flow:d.flow, cold:d.cold });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      toast('انضاف البرّاد، جزاك الله خير');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                await store.update(s.id, { clean:d.clean, flow:d.flow, cold:d.cold });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      toast('تم حفظ التحديث');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              closeSheet();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  await refresh();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    } catch (e) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        toast('صار خطأ، حاول مرة ثانية');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            btn.disabled = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              async function remove(){
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if(!confirm('تبي تحذف هذا البرّاد؟')) return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  try {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      await store.remove(sheetState.id);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          closeSheet();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              await refresh();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  toast('انحذف البرّاد');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    } catch (e) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        toast('ما قدرنا نحذف، حاول مرة ثانية');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          let tt; function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),2400); }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          /* ============ تشغيل ============ */
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          refresh().then(() => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if(coolers.length) map.fitBounds(coolers.map(c=>[c.lat,c.lng]), { padding:[60,60], maxZoom:15 });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              else locate(null, true);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </html>
